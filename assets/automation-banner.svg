<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
<title id="title">Mohammed Kamal — Automation Engineer</title>
<desc id="description">A futuristic industrial automation control system with circuit paths, sensors, a PLC, and robotic machinery.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020617"/>
    <stop offset="0.52" stop-color="#062a33"/>
    <stop offset="1" stop-color="#164e63"/>
  </linearGradient>
  <radialGradient id="halo" cx="68%" cy="48%" r="52%">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".30"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="edge" x1="0" x2="1">
    <stop stop-color="#67e8f9"/>
    <stop offset="1" stop-color="#06b6d4"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#67e8f9" stroke-opacity=".12"/>
  </pattern>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="panelClip"><rect x="746" y="45" width="390" height="270" rx="28"/></clipPath>
</defs>
<rect width="1200" height="360" rx="30" fill="url(#background)"/>
<rect width="1200" height="360" rx="30" fill="url(#grid)"/>
<rect width="1200" height="360" rx="30" fill="url(#halo)"/>
